name: pages

# Build the index and every browser demo, smoke-test the site, then deploy to
# GitHub Pages (https://matt.parrett.us/let-go-lab/). Each demo is single-file +
# offline (wasm + xterm inlined) in its own directory, with a COI service worker
# that re-adds COOP/COEP so the SharedArrayBuffer input ring works on Pages,
# which can't set those headers.
#
# Depends on the offline-bundle machinery (harness/inline-assets.sh + vendored
# xterm, from the #9 work) being present on the deployed branch.
# Pull requests build and smoke-test the site without deploying it.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# One deploy at a time; don't cancel an in-flight deploy. A PR's runs only
# replace each other.
concurrency:
  group: ${{ github.event_name == 'pull_request' && format('pages-pr-{0}', github.ref) || 'pages' }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

# The let-go release is pinned in config/let-go-release, shared with ci.yml (see
# the bump process there). The lab never builds lg itself; it runs a stock
# upstream build.
#
# Was 5ba842f5 (2026-06-27) until 2026-09-19: a floating commit, three months
# stale, and the same drift trap ci.yml's pin was. Tags are bumpable on purpose;
# a SHA nobody revisits is not.
#
# v1.13.0 validated 2026-09-19 by building _site/ locally and serving it over
# plain HTTP (no COOP/COEP) so the coi-serviceworker path is the one exercised:
# renders identically to the headered build.

env:
  # Build the pages with TinyGo instead of the stock Go toolchain: about twice
  # as fast in the browser and a third of the download (docs/profiling-2026-10.md).
  # Pinned like let-go's own CI; -opt=2 trades a little size for speed.
  TINYGO_VERSION: 0.42.0
  LETGO_USE_TINYGO: '1'
  LETGO_TINYGO_OPT: '2'

jobs:
  build:
    runs-on: ubuntu-latest
    # A TinyGo page build takes 4-5 minutes, and there are five (mandelbrot and
    # its sixel variant, pathtrace, ptcanvas, microgpt).
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      # Cloned before setup-go so the toolchain comes from the pinned go.mod.
      - name: Fetch let-go (pinned release)
        run: |
          git clone https://github.com/nooga/let-go let-go-upstream
          git -C let-go-upstream checkout "$(cat config/let-go-release)"

      - uses: actions/setup-go@v5
        with:
          go-version-file: let-go-upstream/go.mod

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install TinyGo (pinned)
        run: |
          curl -fsSL --retry 3 --retry-all-errors --retry-delay 2 \
            "https://github.com/tinygo-org/tinygo/releases/download/v${TINYGO_VERSION}/tinygo${TINYGO_VERSION}.linux-amd64.tar.gz" \
            -o "$RUNNER_TEMP/tinygo.tar.gz"
          tar -xzf "$RUNNER_TEMP/tinygo.tar.gz" -C "$RUNNER_TEMP"
          echo "$RUNNER_TEMP/tinygo/bin" >> "$GITHUB_PATH"
          "$RUNNER_TEMP/tinygo/bin/tinygo" version

      - name: Build let-go (pinned release)
        run: |
          make -C let-go-upstream build
          ln -sfn "$PWD/let-go-upstream" let-go
          . scripts/lib/lg-path.sh
          "$(lg_path "$PWD/let-go")" --version || true

      - name: Build Pages site
        run: scripts/build-pages.sh

      - name: Install Playwright (chromium)
        run: |
          python -m pip install --upgrade pip
          pip install playwright
          python -m playwright install --with-deps chromium

      - name: Smoke-test the site (header-free, project subpath)
        run: python3 test/pages_site_test.py _site

      - uses: actions/configure-pages@v5
        if: github.event_name != 'pull_request'
        with:
          enablement: true   # auto-enable Pages (Actions source) if not already

      - uses: actions/upload-pages-artifact@v3
        if: github.event_name != 'pull_request'
        with:
          path: _site

  deploy:
    needs: build
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
