name: ci

# Smoke suite (#10): protocol/lifecycle/browser boundaries that have produced
# regressions. Runs scripts/ci.sh, which orchestrates the focused tests under
# test/. GitHub sets CI=true, so ci.sh runs in STRICT mode here — a missing
# expected test or tool fails the build (locally it soft-skips). Tool/dependency
# versions and the let-go commit are pinned so CI is reproducible.
on:
  push:
    branches: [main]
  pull_request:

env:
  # Pinned let-go RELEASE (nooga/let-go) for browser smoke tests. It runs
  # a stock upstream build. Pinning a tag keeps CI reproducible; the full clone
  # below fetches tags, so `git checkout` resolves it. To bump: pick a newer tag,
  # build + run `scripts/ci.sh` against it locally, then update this value AND
  # the go-version below to match that tag's go.mod.
  #
  # Held at v1.11.0 until 2026-09-19. That was the oldest release the demos
  # supported, so it was also the least likely to catch upstream drift — and it
  # did not: v1.12.0 renamed the wasm host mount #terminal -> #app (#378) and
  # both browser demos threw on load for two minor versions with CI green the
  # whole time. Prefer the newest release here; the floor the demos *support* is
  # a separate claim, documented in README / CLAUDE.md.
  #
  # Validated 2026-09-19 against v1.13.0: demo builds, suite passes,
  # viewport_fit_test passes at phone-390 and desktop.
  # Resolved SHA: 369e2a69
  LETGO_PIN: v1.13.0

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: '1.27'

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install jq + shellcheck
        run: sudo apt-get update && sudo apt-get install -y jq shellcheck

      - name: Install Playwright (chromium)
        run: |
          python -m pip install --upgrade pip
          pip install playwright
          python -m playwright install --with-deps chromium

      # Build the pinned upstream let-go (LETGO_PIN) and point LETGO at it.
      # Full clone (not --depth 1) so the pinned tag/SHA is fetchable.
      - name: Build let-go (pinned upstream)
        run: |
          git clone https://github.com/nooga/let-go let-go-upstream
          git -C let-go-upstream checkout "$LETGO_PIN"
          make -C let-go-upstream build
          ln -sfn "$PWD/let-go-upstream" let-go
          . scripts/lib/lg-path.sh
          "$(lg_path "$PWD/let-go")" --version || true

      - name: Smoke suite
        run: scripts/ci.sh

  native:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: '1.27.1'

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      # The optional native compiler has its own full-SHA pin. Pages and the
      # browser smoke job continue to use the release pin above.
      - name: Build native demos (SHA-pinned upstream)
        run: |
          scripts/build-native.sh mandelbrot
          scripts/build-native.sh pathtrace
          scripts/build-native.sh microgpt

      - name: Compare native demos with the VM
        run: |
          PIN=$(cat config/let-go-native.sha)
          python3 test/native_demo_test.py --lg ".cache/let-go-native/$PIN/bin/lg" \
            --letgo-src ".cache/let-go-native/$PIN"
          python3 -I experiments/microgpt/verify.py --lg "$PWD/.cache/let-go-native/$PIN/bin/lg"
          LG="$PWD/dist/native/mandelbrot" python3 test/eof_exit_test.py

  # The standalone Go modules: lint and test each one in its own directory,
  # since the jobs above never build them. demos/mandelbrot-aot is left out:
  # it needs a let-go checkout beside the repo (see its go.mod).
  go-modules:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        module: [experiments/cueplay, experiments/aot/native]
    defaults:
      run:
        working-directory: ${{ matrix.module }}
    env:
      CGO_ENABLED: "0"
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: ${{ matrix.module }}/go.mod
          cache: false  # tiny modules, and aot/native has no go.sum

      - name: gofmt
        run: |
          unformatted=$(gofmt -l .)
          if [ -n "$unformatted" ]; then echo "gofmt needed on:"; echo "$unformatted"; exit 1; fi

      - name: vet
        run: go vet ./...

      - name: test
        run: go test ./...

      # cueplay promises cgo-free builds on macOS too; vet above covers Linux.
      - name: build for macOS
        run: GOOS=darwin go build ./...
