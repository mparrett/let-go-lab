<!--
  Canvas shell for the pathtrace demo. No xterm: in the browser the program hands
  each pass to the page as an RGBA framebuffer through let-go's surface capability
  (LetGoHost.onSurface), and this shell blits it to a <canvas> with putImageData.
  Status arrives out-of-band via js/emit (LetGoHost.onEmit); keys and the touch
  buttons go back through LetGoHost.sendInput. Natively the same program still
  draws PNG frames through iTerm2's inline-image protocol.
  The xterm-assets marker below is required by the build (harness/inline-assets.sh)
  and harmless: those globals just go unused here.
-->
<!--LETGO-LAB-XTERM-ASSETS-->
<style>
  html, body { background: #0b0b0b; margin: 0; height: 100%; color: #cfcfcf;
    font-family: "IBM Plex Mono", Menlo, Consolas, monospace; }
  body { display: flex; flex-direction: column; align-items: center; justify-content: center;
    gap: 12px; padding-inline: 16px; box-sizing: border-box; }
  #pt-title { font-size: 13px; }
  #pt-canvas {
    /* The render is small (W×H in pathtrace.lg); scale it up smoothly. The canvas
       keeps its intrinsic aspect ratio, so only the width is set. */
    background: #000; border: 1px solid #222;
    width: min(92vw, 720px); height: auto;
  }
  #pt-status { font-size: 13px; color: #9a988f; text-align: center; min-height: 1.4em; }
  #pt-controls { display: flex; flex-wrap: wrap; gap: 8px; justify-content: center; }
  #pt-controls button {
    font: inherit; font-size: 14px; min-width: 44px; height: 40px; padding: 0 12px;
    background: #171717; color: #cfcfcf; border: 1px solid #333; border-radius: 6px; cursor: pointer;
  }
  #pt-controls button:hover { border-color: #666; }
  #pt-controls button:focus-visible { outline: 2px solid #d7a65b; outline-offset: 2px; }
  #pt-note { font-size: 13px; color: #d7a65b; text-align: center; max-width: min(92vw, 720px); }
</style>
<script>
  (function () {
    function start(mode) {
      // The base lg page ships a mount (#app) and a #status line; this shell
      // uses neither, and the flex:1 mount would push the canvas down the page.
      for (const id of ["app", "status"]) {
        const el = document.getElementById(id);
        if (el) el.style.display = "none";
      }
      // 'worker' means cross-origin isolated, so the input ring is live. In the
      // main-thread fallback sendInput can't deliver, so keys and buttons are off.
      const interactive = mode === "worker";
      const title = document.createElement("div");
      title.id = "pt-title";
      title.textContent = "pathtrace · let-go" + (interactive ? " · hjkl orbit · n scene · r reset" : "");
      const canvas = document.createElement("canvas");
      canvas.id = "pt-canvas";
      canvas.setAttribute("role", "img");
      canvas.setAttribute("aria-label", "Path-traced spheres, refining pass by pass");
      const status = document.createElement("div");
      status.id = "pt-status";
      status.setAttribute("role", "status");
      status.textContent = "tracing the first pass…";
      document.body.append(title, canvas, status);

      const ctx = canvas.getContext("2d");
      window.LetGoHost.onSurface((buf, w, h) => {
        if (canvas.width !== w || canvas.height !== h) { canvas.width = w; canvas.height = h; }
        ctx.putImageData(new ImageData(new Uint8ClampedArray(buf), w, h), 0, 0);
      });
      window.LetGoHost.onEmit((name, d) => {
        if (name !== "status") return;
        status.textContent =
          `scene ${d.scene} · ${d.spp} spp · ${d.w}×${d.h} · compute ${d.compute}ms · present ${d.present}ms /pass`;
      });

      if (!interactive) {
        const note = document.createElement("div");
        note.id = "pt-note";
        note.textContent = "Interactive input unavailable: the page isn't cross-origin isolated, "
          + "so the runtime fell back to main-thread mode. The render still runs.";
        document.body.append(note);
        return;
      }
      const send = (s) => window.LetGoHost.sendInput(s);
      const CSI = { ArrowUp: "\x1b[A", ArrowDown: "\x1b[B", ArrowRight: "\x1b[C", ArrowLeft: "\x1b[D" };
      window.addEventListener("keydown", (e) => {
        if (e.metaKey || e.ctrlKey || e.altKey) return;
        const seq = CSI[e.key] || (e.key.length === 1 ? e.key : "");
        if (seq && send(seq)) e.preventDefault();
      });
      // Touch and mouse: the same keys as buttons.
      const controls = document.createElement("div");
      controls.id = "pt-controls";
      for (const [label, key, name] of [["◀", "h", "Orbit left"], ["▶", "l", "Orbit right"],
                                         ["▲", "k", "Raise camera"], ["▼", "j", "Lower camera"],
                                         ["scene", "n", "Next scene"], ["reset", "r", "Reset camera"]]) {
        const b = document.createElement("button");
        b.type = "button"; b.textContent = label; b.title = name; b.setAttribute("aria-label", name);
        b.addEventListener("click", () => send(key));
        controls.append(b);
      }
      document.body.append(controls);
      if (window.LetGoHost.setSize) window.LetGoHost.setSize(80, 24);
    }
    window.LetGoHost.onReady((mode) => start(mode));
  })();
</script>
