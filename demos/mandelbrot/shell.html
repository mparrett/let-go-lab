<!--
  Canvas shell for the mandelbrot demo. No xterm: in the browser the program
  hands each frame to the page as an RGBA framebuffer, one pixel per grid point,
  through let-go's surface capability (LetGoHost.onSurface); this shell blits it
  to a <canvas> and the browser scales it up. Status arrives out-of-band via
  js/emit (LetGoHost.onEmit). Keys, buttons, taps and the wheel go back through
  LetGoHost.sendInput: keys as themselves, taps and the wheel as SGR mouse
  strings, which the program already parses.

  Taps are reported on a grid CLICK_RES times finer than the frame (640x480 for
  the 160x120 grid); the program's canvas-click->center uses the same factor.
  Natively the same program still draws sixel in the terminal.

  The xterm-assets marker below is required by the build (harness/inline-assets.sh)
  and harmless: those globals just go unused here.
-->
<!--LETGO-LAB-XTERM-ASSETS-->
<style>
  html, body { background: #000; margin: 0; height: 100%; color: #cfcfcf;
    font-family: "IBM Plex Mono", Menlo, Consolas, monospace; }
  body { display: flex; flex-direction: column; align-items: center; justify-content: center;
    gap: 10px; padding-inline: 16px; box-sizing: border-box; }
  @media (orientation: portrait) { body { justify-content: flex-start; padding-block: 16px; } }
  #mb-head, #mb-foot { width: var(--mb-w, 640px); max-width: 100%; font-size: 13px; line-height: 1.5; }
  #mb-head .t { color: #cfcfcf; }
  #mb-coords, #mb-timing, #mb-hint { color: #8f8d85; font-variant-numeric: tabular-nums; }
  #mb-canvas {
    display: block; width: var(--mb-w, 640px); max-width: 100%; height: auto;
    image-rendering: pixelated;          /* crisp grid cells, like the terminal version */
    background: #000; cursor: crosshair; touch-action: manipulation;
    transition: filter 0.15s ease-out;
  }
  #mb-canvas.busy { filter: brightness(0.55); }
  #mb-controls { display: flex; flex-wrap: wrap; gap: 8px; justify-content: center; }
  #mb-controls button {
    font: inherit; font-size: 14px; min-width: 44px; height: 40px; padding: 0 12px;
    background: #141414; color: #cfcfcf; border: 1px solid #333; border-radius: 6px; cursor: pointer;
  }
  #mb-controls button:hover { border-color: #666; }
  #mb-controls button:focus-visible { outline: 2px solid #d7a65b; outline-offset: 2px; }
  #mb-note { font-size: 13px; color: #d7a65b; text-align: center; max-width: 640px; }
</style>
<script>
  (function () {
    const CLICK_RES = 4;          // matches click-res in mandelbrot.lg
    const CHROME_PX = 170;        // header + footer + buttons, for the fit below

    function start(mode) {
      for (const id of ["app", "status"]) {
        const el = document.getElementById(id);
        if (el) el.style.display = "none";
      }
      const interactive = mode === "worker";
      const head = document.createElement("div");
      head.id = "mb-head";
      head.innerHTML = '<div class="t">mandelbrot · let-go</div><div id="mb-coords">loading…</div>';
      const canvas = document.createElement("canvas");
      canvas.id = "mb-canvas";
      canvas.width = 160; canvas.height = 120;       // replaced by the first frame's size
      canvas.setAttribute("role", "img");
      canvas.setAttribute("aria-label", "The Mandelbrot set at the current view");
      const foot = document.createElement("div");
      foot.id = "mb-foot";
      foot.innerHTML = '<div id="mb-timing" role="status"></div>'
        + '<div id="mb-hint">tap the centre to zoom in, an edge to pan · shift-click or − to zoom out · wheel zooms</div>';
      document.body.append(head, canvas, foot);
      const coords = document.getElementById("mb-coords");
      const timing = document.getElementById("mb-timing");

      // Largest 4:3 canvas that fits beside the chrome, in whole CSS pixels.
      function fit() {
        const w = Math.max(160, Math.floor(Math.min(window.innerWidth - 32,
          (window.innerHeight - CHROME_PX) * canvas.width / canvas.height, 1120)));
        document.documentElement.style.setProperty("--mb-w", w + "px");
      }
      fit();
      window.addEventListener("resize", fit);
      if (window.visualViewport) window.visualViewport.addEventListener("resize", fit);

      const ctx = canvas.getContext("2d");
      window.LetGoHost.onSurface((buf, w, h) => {
        if (canvas.width !== w || canvas.height !== h) { canvas.width = w; canvas.height = h; fit(); }
        ctx.putImageData(new ImageData(new Uint8ClampedArray(buf), w, h), 0, 0);
      });
      let busy = false;
      window.LetGoHost.onEmit((name, d) => {
        if (name === "busy") {
          busy = true; canvas.classList.add("busy"); coords.textContent = "computing…";
        } else if (name === "status") {
          busy = false; canvas.classList.remove("busy");
          window.__mbStatus = d;      // read by test/viewport_fit_test.py
          window.__mbFrames = (window.__mbFrames || 0) + 1;
          coords.textContent = `x=${d.x} y=${d.y} zoom=${d.zoom}x`;
          timing.textContent = `compute ${d.compute}ms · present ${d.present}ms · iters ${d.iters}`
            + ` · maxiter ${d.maxiter} · ${d.w}×${d.h}`;
        }
      });

      if (!interactive) {
        const note = document.createElement("div");
        note.id = "mb-note";
        note.textContent = "Interactive input unavailable: the page isn't cross-origin isolated, "
          + "so the runtime fell back to main-thread mode. The first view still renders.";
        document.body.append(note);
        return;
      }
      const send = (s) => window.LetGoHost.sendInput(s);
      const CSI = { ArrowUp: "\x1b[A", ArrowDown: "\x1b[B", ArrowRight: "\x1b[C", ArrowLeft: "\x1b[D" };
      window.addEventListener("keydown", (e) => {
        if (e.metaKey || e.ctrlKey || e.altKey) return;
        const seq = CSI[e.key] || (e.key.length === 1 ? e.key : "");
        if (seq && send(seq)) e.preventDefault();
      });
      // A tap or click: its position on the CLICK_RES-finer grid, 1-based, as an
      // SGR left press (bit 2 = Shift, which zooms out).
      canvas.addEventListener("click", (e) => {
        const r = canvas.getBoundingClientRect();
        const x = 1 + Math.floor((e.clientX - r.left) / r.width * canvas.width * CLICK_RES);
        const y = 1 + Math.floor((e.clientY - r.top) / r.height * canvas.height * CLICK_RES);
        send(`\x1b[<${e.shiftKey ? 4 : 0};${x};${y}M`);
      });
      // The wheel zooms (SGR 64 up / 65 down). One step per finished frame: a
      // render takes a while and queued steps would land long after the scroll.
      canvas.addEventListener("wheel", (e) => {
        e.preventDefault();
        if (busy) return;
        busy = true;
        send(`\x1b[<${e.deltaY < 0 ? 64 : 65};1;1M`);
      }, { passive: false });
      const controls = document.createElement("div");
      controls.id = "mb-controls";
      for (const [label, key, name] of [["+", "+", "Zoom in"], ["−", "-", "Zoom out"],
                                         ["less detail", ",", "Fewer iterations"],
                                         ["more detail", ".", "More iterations"],
                                         ["reset", "r", "Reset the view"]]) {
        const b = document.createElement("button");
        b.type = "button"; b.textContent = label; b.title = name; b.setAttribute("aria-label", name);
        b.addEventListener("click", () => send(key));
        controls.append(b);
      }
      document.body.append(controls);
      if (window.LetGoHost.setSize) window.LetGoHost.setSize(80, 24);
    }
    window.LetGoHost.onReady((mode) => start(mode));
  })();
</script>
